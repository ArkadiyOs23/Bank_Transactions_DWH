services:
  postgres:
    image: postgres:16
    container_name: bank_dwh_postgres
    environment:
      POSTGRES_USER: dwh_user
      POSTGRES_PASSWORD: dwh_pass
      POSTGRES_DB: bank_dwh
    ports:
      - "5432:5432"
    volumes:
      - ./sql/01_schema_postgresql.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/03_indexes_and_partitioning.sql:/docker-entrypoint-initdb.d/02_indexes.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwh_user -d bank_dwh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
